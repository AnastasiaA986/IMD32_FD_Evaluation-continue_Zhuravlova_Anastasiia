<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="layout">
      <div class="buttons-group">
        <div class="buttons-vertical">
          <button
            class="button btn-size-default btn-state-default btn-style-primary"
          >
            Label
          </button>
          <button
            class="button btn-size-small btn-state-default btn-style-primary"
          >
            Label
          </button>
        </div>

        <div class="buttons-vertical">
          <button
            class="button btn-size-default btn-state-hover btn-style-primary"
          >
            Label
          </button>
          <button
            class="button btn-size-small btn-state-hover btn-style-primary"
          >
            Label
          </button>
        </div>

        <div class="buttons-vertical">
          <button
            class="button btn-size-default btn-state-disabled btn-style-primary"
          >
            Label
          </button>
          <button
            class="button btn-size-small btn-state-disabled btn-style-primary"
          >
            Label
          </button>
        </div>
      </div>

      <div class="buttons-group buttons-group-secondary">
        <div class="buttons-vertical">
          <button
            class="button btn-size-default btn-state-default btn-style-secondary"
          >
            Label
          </button>
          <button
            class="button btn-size-small btn-state-default btn-style-secondary"
          >
            Label
          </button>
        </div>

        <div class="buttons-vertical">
          <button
            class="button btn-size-default btn-state-hover btn-style-secondary"
          >
            Label
          </button>
          <button
            class="button btn-size-small btn-state-hover btn-style-secondary"
          >
            Label
          </button>
        </div>

        <div class="buttons-vertical">
          <button
            class="button btn-size-default btn-state-disabled btn-style-secondary"
          >
            Label
          </button>
          <button
            class="button btn-size-small btn-state-disabled btn-style-secondary"
          >
            Label
          </button>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
