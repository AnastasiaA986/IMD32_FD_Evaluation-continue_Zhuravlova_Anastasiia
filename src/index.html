<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article class="card">
      <img
        class="card-image"
        src="/src/images/san-francisco.png?as=webp"
        alt="San Francisco Bridge"
      />

      <div class="card-content">
        <div class="card-title">
          <h2>San Francisco</h2>
          <p class="card-subtitle">Premium economy</p>
        </div>

        <div class="informations">
          <div class="informations-from-price">
            <img src="/src/images/icon-label.svg" alt="" />
            <p>From 900 CHF</p>
          </div>
          <div class="informations-airport">
            <img src="/src/images/icon-plane.svg" alt="" />
            <p>SFO</p>
          </div>
        </div>

        <div class="card-ctas">
          <button class="button btn-size-small btn-style-primary">
            Search flight
          </button>
          <button class="">
            <img src="/src/images/icon-heart.svg" alt="" />
          </button>
        </div>
      </div>
    </article>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
